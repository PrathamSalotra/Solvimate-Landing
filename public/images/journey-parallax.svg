<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="journeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#journeyBg)" />

  <!-- Background Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="170" x2="1200" y2="170" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="510" x2="1200" y2="510" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Ascending Journey Roadmap -->
  <path d="M 100 560 Q 400 500 500 380 T 900 240 T 1100 120" fill="none" stroke="url(#pathGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 100 560 Q 400 500 500 380 T 900 240 T 1100 120" fill="none" stroke="url(#pathGrad)" stroke-width="20" stroke-opacity="0.15" />

  <!-- Milestone Nodes & Glowing Halos -->
  <g>
    <circle cx="100" cy="560" r="45" fill="url(#starGlow)" />
    <circle cx="100" cy="560" r="14" fill="#3b82f6" stroke="#fff" stroke-width="3" />
    <text x="100" y="615" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">LEARN</text>

    <circle cx="500" cy="380" r="60" fill="url(#starGlow)" />
    <circle cx="500" cy="380" r="18" fill="#10b981" stroke="#fff" stroke-width="3" />
    <text x="500" y="445" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">GROW</text>

    <circle cx="900" cy="240" r="75" fill="url(#starGlow)" />
    <circle cx="900" cy="240" r="22" fill="#60a5fa" stroke="#fff" stroke-width="4" />
    <text x="900" y="315" fill="#60a5fa" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">TRANSFORM</text>

    <circle cx="1100" cy="120" r="12" fill="#fff" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Floating Star Constellations -->
  <g fill="#fff" opacity="0.6">
    <circle cx="250" cy="180" r="2" />
    <circle cx="320" cy="210" r="3" />
    <circle cx="750" cy="130" r="2" />
    <circle cx="820" cy="95" r="3" />
    <circle cx="1050" cy="350" r="2" />
  </g>
</svg>
